<!doctype html><html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Biblioteca Alimentar · The Mile</title><link rel="stylesheet" href="/food-library.css?v=10"><link rel="stylesheet" href="/nutrition-nav.css?v=15"><script src="/nutrition-theme.js?v=2"></script><link rel="stylesheet" href="/nutrition-theme.css?v=4"><link rel="stylesheet" href="/tm-design-system.css?v=9"></head><body><div class="tm-library-layout"><aside class="tm-admin-sidebar" aria-label="Navegação do Backoffice" data-tm-nav-page="food-library"></aside><main class="shell"><div class="top food-library-top"><a class="back food-library-back" href="/" data-nutrition-back aria-label="Voltar ao Início"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg><span>Início</span></a><button class="primary tm-action-new" id="new" type="button">+ Novo alimento</button></div><section class="panel food-catalog-panel"><div class="scroll"><table class="food-catalog-table"><colgroup><col class="col-category"><col class="col-food"><col class="col-notes"><col class="col-macro"><col class="col-macro"><col class="col-macro"><col class="col-macro"><col class="col-edit"></colgroup><thead><tr class="food-filter-row"><th><select id="category" aria-label="Filtrar categoria"><option value="">Todas as categorias</option></select></th><th><input id="search" type="search" placeholder="Pesquisar alimento…" aria-label="Pesquisar alimento"></th><th colspan="6"></th></tr><tr class="food-header-row"><th>Categoria</th><th>Alimento</th><th>Notas</th><th class="num">kcal</th><th class="num">P</th><th class="num">HC</th><th class="num">G</th><th aria-label="Ações"></th></tr></thead><tbody id="rows"></tbody></table></div><div class="empty" id="empty" hidden>Não foram encontrados alimentos.</div><span id="feedback" class="sr-only" role="status" aria-live="polite"></span></section></main></div><dialog id="editor"><form id="food-form"><h2 id="editor-title">Novo alimento</h2><div class="fields"><label class="wide">Nome<input name="display_name" required maxlength="240"></label><label>Categoria<input name="category" required maxlength="120"></label><label>Tipo de pesagem<select name="variant"><option value="plain">Normal</option><option value="edible">Descascado / edível</option><option value="gross">Com casca / bruto</option></select></label><label>Fator edível (0–1)<input name="edible_fraction" type="number" step=".001" min=".001" max="1" value="1" required></label><label>Porção de referência (g)<input name="reference_g" type="number" step=".01" min=".01"></label><label>Energia (kcal / 100 g)<input name="kcal" type="number" min="0" step=".001" required></label><label>Proteínas (g / 100 g)<input name="protein_g" type="number" min="0" step=".001" required></label><label>Hidratos (g / 100 g)<input name="carbs_g" type="number" min="0" step=".001" required></label><label>Gorduras (g / 100 g)<input name="fat_g" type="number" min="0" step=".001" required></label><label class="wide">Notas<input name="notes"></label></div><p id="form-feedback" class="error" role="alert"></p><div class="actions"><button type="button" id="cancel" class="tm-action-secondary">Cancelar</button><button class="primary tm-action-primary" type="submit">Guardar</button></div></form></dialog><script src="/food-library.js?v=12" defer></script>
