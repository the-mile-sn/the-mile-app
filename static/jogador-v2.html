<!doctype html>
<html lang="pt-PT"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101013"><title>The Mile · Jogador (testes)</title><link rel="stylesheet" href="/jogador-v2.css?v=75"></head>
<body><main class="shell">
<header class="player-top"><button id="player-avatar" type="button" aria-label="Perfil do jogador" title="Perfil"><span id="avatar-initials">TM</span></button><button id="logout" type="button" hidden>Sair</button></header>
<section id="login-panel" class="panel"><h1>Área do jogador</h1><p>Inicia sessão com as credenciais atribuídas pela equipa.</p><form id="login-form"><label>Username<input id="username" autocomplete="username" autocapitalize="none" required></label><label>Palavra-passe<input id="password" type="password" autocomplete="current-password" required></label><button type="submit">Entrar</button></form><p id="login-error" class="error" role="alert"></p></section>
<section id="player-panel" hidden><div class="welcome"><h1 id="player-name"></h1><p>Planeamento nutricional</p></div><nav id="tabs" aria-label="Navegação"><button data-tab="overview" aria-pressed="true"><i class="mile-icon icon-home-09"></i><span>Início</span></button><button data-tab="plans" aria-pressed="false"><i class="mile-icon icon-files-01"></i><span>Planos</span></button><button data-tab="new" aria-pressed="false" aria-label="Inserir novo" title="Inserir novo"><i class="mile-icon icon-add-circle"></i></button><button data-tab="menus" aria-pressed="false"><i class="mile-icon icon-menu-restaurant"></i><span>Menus</span></button><button data-tab="profile" aria-pressed="false"><i class="mile-icon icon-user-03"></i><span>Perfil</span></button></nav>
<section id="overview"><nav id="overview-mode" aria-label="Modo de visualização"><button type="button" data-view="week" aria-pressed="false">Semana</button><button type="button" data-view="day" aria-pressed="true">Dia</button></nav><div id="week-strip" class="week" aria-label="Calendário semanal"></div><p id="date-title" class="selected-date"></p><div id="day-details"></div><div id="weekly-view" hidden></div></section>
<section id="plans" hidden><h2>Planos</h2><div id="plan-colors" class="colors"></div><div id="plan-detail"></div></section>
<section id="menus" hidden><div class="date-nav"><button id="menu-prev" aria-label="Semana anterior">‹</button><strong id="menu-week"></strong><button id="menu-next" aria-label="Semana seguinte">›</button></div><div id="menu-days"></div></section><section id="new" class="placeholder-screen" hidden><h2>Inserir novo</h2><p>Em preparação.</p></section><section id="profile" class="placeholder-screen" hidden><h2>Perfil</h2><p>Em preparação.</p><button id="profile-logout" type="button">Terminar sessão</button></section></section>
<p id="status" class="status" role="status"></p><footer>Ambiente de testes · The Mile 2.0</footer></main><script src="/jogador-v2.js?v=55" defer></script></body></html>
