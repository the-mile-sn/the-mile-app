<!doctype html>
<html lang="pt-PT"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101013"><title>The Mile · Jogador (testes)</title><link rel="stylesheet" href="/jogador-v2.css?v=92"></head>
<body><main class="shell">
<header class="player-top"><button id="player-avatar" type="button" aria-label="Perfil do jogador" title="Perfil"><span id="avatar-initials">TM</span></button><button id="logout" type="button" hidden>Sair</button></header>
<section id="login-panel" class="panel"><h1>Área do jogador</h1><p>Inicia sessão com as credenciais atribuídas pela equipa.</p><form id="login-form"><label>Username<input id="username" autocomplete="username" autocapitalize="none" required></label><label>Palavra-passe<input id="password" type="password" autocomplete="current-password" required></label><button type="submit">Entrar</button></form><p id="login-error" class="error" role="alert"></p></section>
<section id="player-panel" hidden><div class="welcome"><h1 id="player-name"></h1><p>Planeamento nutricional</p></div><nav id="tabs" aria-label="Navegação"><button data-tab="overview" aria-pressed="true"><i class="mile-icon icon-home-09"></i><span>Início</span></button><button data-tab="plans" aria-pressed="false"><i class="mile-icon icon-files-01"></i><span>Docs</span></button><button data-tab="new" aria-pressed="false" aria-label="Inserir novo" title="Inserir novo"><i class="mile-icon icon-add-circle"></i></button><button data-tab="menus" aria-pressed="false"><i class="mile-icon icon-menu-restaurant"></i><span>Menus</span></button><button data-tab="profile" aria-pressed="false"><i class="mile-icon icon-user-03"></i><span>Perfil</span></button></nav>
<section id="overview"><nav id="overview-mode" aria-label="Modo de visualização"><button type="button" data-view="day" aria-pressed="true">Dia</button><button type="button" data-view="week" aria-pressed="false">Semana</button></nav><div id="week-strip" class="week" aria-label="Calendário semanal"></div><p id="date-title" class="selected-date"></p><div id="day-details"></div><div id="weekly-view" hidden></div></section>
<section id="plans" hidden><div id="plans-landing" class="plans-landing"><button type="button" id="plans-open-prescriptions" class="plans-entry-card"><i class="mile-icon icon-files-01" aria-hidden="true"></i><span>Planos</span><span aria-hidden="true" class="plans-entry-arrow">›</span></button><button type="button" id="plans-open-assessments" class="plans-entry-card"><i class="mile-icon icon-chart-03" aria-hidden="true"></i><span>Avaliações</span><span aria-hidden="true" class="plans-entry-arrow">›</span></button></div><div id="plans-prescriptions" hidden><button type="button" class="plans-back" id="plans-back-prescriptions"><span aria-hidden="true">‹</span> Planos</button><div id="plan-colors" class="colors"></div><div id="plan-detail"></div></div><div id="plans-assessments" hidden><button type="button" class="plans-back" id="plans-back-assessments"><span aria-hidden="true">‹</span> Avaliações</button><div class="assessment-tabs" role="tablist" aria-label="Dados de composição corporal"><button type="button" data-assessment-tab="resumo" aria-pressed="true">Resumo</button><button type="button" data-assessment-tab="pregas" aria-pressed="false">Pregas</button><button type="button" data-assessment-tab="perimetros" aria-pressed="false">Perímetros</button></div><div class="assessment-most-recent" id="assessment-most-recent"></div><div id="assessment-measurements"></div></div></section>
<section id="menus" hidden><div class="date-nav"><button id="menu-prev" aria-label="Semana anterior">‹</button><strong id="menu-week"></strong><button id="menu-next" aria-label="Semana seguinte">›</button></div><div id="menu-days"></div></section><section id="new" class="placeholder-screen" hidden><h2>Inserir novo</h2><p>Em preparação.</p></section><section id="profile" class="profile-screen" hidden><div class="profile-identity"><div class="profile-photo-circle"><img id="profile-photo" alt="Fotografia de perfil" hidden><span id="profile-photo-initials">TM</span></div><strong id="profile-display-name"></strong><span id="profile-display-username"></span></div><div class="profile-plan-card"><span>Plano atual</span><strong id="profile-plan-value">Por definir</strong></div><div class="profile-actions-card"><button id="profile-password-toggle" type="button" class="profile-action"><span class="mile-icon icon-key-01" aria-hidden="true"></span><span>Alterar palavra-passe</span><span class="profile-action-chevron" aria-hidden="true">›</span></button><form id="profile-password-form" class="profile-password-form" hidden><label>Palavra-passe atual<input id="profile-current-password" type="password" autocomplete="current-password" required></label><label>Nova palavra-passe<input id="profile-new-password" type="password" autocomplete="new-password" minlength="8" required></label><label>Confirmar nova palavra-passe<input id="profile-confirm-password" type="password" autocomplete="new-password" minlength="8" required></label><p id="profile-password-feedback" role="status"></p><button type="submit" class="profile-password-save">Guardar palavra-passe</button></form><button id="profile-logout" type="button" class="profile-action"><span class="mile-icon icon-door-01" aria-hidden="true"></span><span>Terminar sessão</span></button></div></section></section>
<p id="status" class="status" role="status"></p></main><script src="/jogador-v2.js?v=68" defer></script></body></html>
