<!doctype html>
<html lang="pt-PT"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101013"><title>The Mile · Jogador (testes)</title><link rel="stylesheet" href="/jogador-v2.css?v=59"></head>
<body><main class="shell">
<header><div class="brand">THE MILE <small>TESTES</small></div><button id="logout" type="button" hidden>Sair</button></header>
<section id="login-panel" class="panel"><h1>Área do jogador</h1><p>Inicia sessão com as credenciais atribuídas pela equipa.</p><form id="login-form"><label>Username<input id="username" autocomplete="username" autocapitalize="none" required></label><label>Palavra-passe<input id="password" type="password" autocomplete="current-password" required></label><button type="submit">Entrar</button></form><p id="login-error" class="error" role="alert"></p></section>
<section id="player-panel" hidden><div class="welcome"><h1 id="player-name"></h1><p>Planeamento nutricional</p></div><nav id="tabs" aria-label="Navegação"><button data-tab="overview" aria-pressed="true">Vista geral</button><button data-tab="plans" aria-pressed="false">Planos</button><button data-tab="menus" aria-pressed="false">Menus</button></nav>
<section id="overview"><nav id="overview-mode" aria-label="Modo de visualização"><button type="button" data-view="day" aria-pressed="true">Dia</button><button type="button" data-view="week" aria-pressed="false">Semana</button></nav><div id="week-strip" class="week" aria-label="Calendário semanal"></div><p id="date-title" class="selected-date"></p><div id="day-details"></div><div id="weekly-view" hidden></div></section>
<section id="plans" hidden><h2>Planos</h2><div id="plan-colors" class="colors"></div><div id="plan-detail"></div></section>
<section id="menus" hidden><h2>Menus semanais</h2><div class="date-nav"><button id="menu-prev" aria-label="Semana anterior">‹</button><strong id="menu-week"></strong><button id="menu-next" aria-label="Semana seguinte">›</button></div><div id="menu-days"></div></section></section>
<p id="status" class="status" role="status"></p><footer>Ambiente de testes · The Mile 2.0</footer></main><script src="/jogador-v2.js?v=43" defer></script></body></html>
