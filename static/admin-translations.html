<!doctype html>
<html lang="pt" data-admin-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Traduções · The Mile Backoffice</title>
<link rel="stylesheet" href="/admin-surface-palette.css?v=205">
<link rel="stylesheet" href="/admin-translations.css?v=20">
<script defer src="/admin-translations.js?v=20"></script>
<script defer src="/admin-translations-plans.js?v=17"></script>
</head>
<body>
<main class="i18n-shell" id="i18n-app">
  <header class="i18n-topbar">
    <a class="i18n-home" href="/" aria-label="Voltar ao início do Backoffice">‹ <span>Início</span></a>
    <span class="i18n-product">The Mile <span aria-hidden="true">/</span> Backoffice</span>
  </header>
  <section class="i18n-intro" aria-labelledby="i18n-title">
    <h1 id="i18n-title">Traduções</h1>
  </section>
  <p id="i18n-feedback" class="i18n-feedback" role="status" aria-live="polite">A carregar…</p>
  <section class="i18n-stats" id="i18n-stats" aria-label="Resumo de traduções" hidden></section>
  <section class="i18n-library-panel" aria-labelledby="i18n-lib-title" hidden id="i18n-library-panel">
    <div class="i18n-section-heading"><h2 id="i18n-lib-title">Áreas de tradução</h2></div>
    <div id="i18n-libraries" class="i18n-library-grid"></div>
  </section>
  <section class="i18n-work-panel" id="i18n-work-panel" aria-labelledby="i18n-work-title" hidden>
    <div class="i18n-section-heading i18n-work-heading">
      <h2 id="i18n-work-title">Revisão manual</h2>
      <a id="i18n-library-link" href="/?nav=food-library" class="i18n-link">Abrir biblioteca</a>
    </div>
    <div class="i18n-toolbar">
      <label>Estado
        <select id="i18n-status" aria-label="Estado da tradução">
          <option value="all">Todos</option>
          <option value="missing">Por traduzir</option>
          <option value="legacy_review">Por rever · inglês existente</option>
          <option value="pending">Por rever</option>
          <option value="approved">Aprovados</option>
          <option value="outdated">Desatualizados</option>
        </select>
      </label>
      <label class="i18n-search">Pesquisar
        <input type="search" id="i18n-search" maxlength="120" autocomplete="off" placeholder="Pesquisar conteúdos…">
      </label>
    </div>
    <div class="i18n-bulk-tools" id="i18n-bulk-tools" hidden>
      <button type="button" id="i18n-bulk-open" class="i18n-secondary">Rever e aprovar em lote</button>
    </div>
    <section id="i18n-bulk-review" class="i18n-bulk-review" aria-labelledby="i18n-bulk-title" hidden>
      <div class="i18n-section-heading">
        <h3 id="i18n-bulk-title">Aprovação em lote · Alimentos</h3>
        <button type="button" id="i18n-bulk-close" class="i18n-quiet">Fechar</button>
      </div>
      <p id="i18n-bulk-summary" class="i18n-results-count" role="status" aria-live="polite"></p>
      <div class="i18n-bulk-controls">
        <div class="i18n-bulk-selection">
          <button type="button" id="i18n-bulk-select-100" class="i18n-secondary">Selecionar 100</button>
          <label class="i18n-bulk-select-all"><input type="checkbox" id="i18n-bulk-select-all"> <span id="i18n-bulk-all-label">Selecionar todas as propostas pendentes</span></label>
        </div>
        <label class="i18n-bulk-filter">Pesquisar nesta revisão
          <input type="search" id="i18n-bulk-filter" placeholder="Pesquisar PT ou EN…" autocomplete="off">
        </label>
      </div>
      <div id="i18n-bulk-items" class="i18n-bulk-items" role="group" aria-label="Propostas PT e EN para aprovação"></div>
      <label class="i18n-bulk-attestation"><input type="checkbox" id="i18n-bulk-reviewed"> Confirmei a revisão das traduções selecionadas.</label>
      <div class="i18n-bulk-footer">
        <button type="button" class="i18n-primary" id="i18n-bulk-submit" disabled>Aprovar selecionadas</button>
      </div>
      <p id="i18n-bulk-feedback" class="i18n-feedback" role="status" aria-live="polite"></p>
    </section>
    <div id="i18n-plan-stage" class="i18n-plan-stage" aria-label="Revisão privada das traduções dos planos" hidden>
      <span class="i18n-status-pill" data-state="pending">Em preparação</span>
    </div>
    <div id="i18n-results-count" class="i18n-results-count" aria-live="polite"></div>
    <div id="i18n-results" class="i18n-results"></div>
    <div class="i18n-pagination">
      <button id="i18n-prev" type="button">Anterior</button>
      <span id="i18n-page-indicator"></span>
      <button id="i18n-next" type="button">Seguinte</button>
    </div>
  </section>
  
  <dialog id="i18n-review-dialog" class="i18n-review-dialog" aria-labelledby="i18n-review-title">
  <section class="i18n-review" id="i18n-review" aria-labelledby="i18n-review-title" hidden>
    <div class="i18n-review-heading">
      <h2 id="i18n-review-title">Rever tradução</h2>
      <button type="button" id="i18n-close" class="i18n-quiet">Fechar</button>
    </div>
    <label class="i18n-field-label" id="i18n-field-picker" for="i18n-fields">Texto apresentado nas apps
      <select id="i18n-fields" aria-label="Texto a traduzir"></select>
    </label>
    <div class="i18n-compare">
      <div class="i18n-source">
        <h3>Português · original</h3><p id="i18n-source-text"></p>
      </div>
      <div class="i18n-target">
        <label for="i18n-target-text">English · tradução proposta</label>
        <textarea id="i18n-target-text" maxlength="10000" rows="4" spellcheck="true" aria-describedby="i18n-translation-state"></textarea>
        <p id="i18n-translation-state"></p>
      </div>
    </div>
    <div id="i18n-existing" class="i18n-existing" hidden>
      <p>Inglês existente · por rever</p>
    </div>
    <p id="i18n-review-feedback" role="status" aria-live="polite"></p>
    <div class="i18n-actions">
      <button type="button" id="i18n-propose" class="i18n-primary">Guardar proposta</button>
      <button type="button" id="i18n-approve" class="i18n-primary" disabled>Aprovar tradução revista</button>
    </div>
    <details id="i18n-history-panel">
      <summary><span>Histórico de revisão</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></summary>
      <div id="i18n-history"></div>
    </details>
  </section>
  </dialog>
</main>
</body>
</html>
