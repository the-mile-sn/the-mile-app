<!doctype html><html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Planos · The Mile</title><link rel="stylesheet" href="/food-library.css?v=4"><link rel="stylesheet" href="/nutrition-nav.css?v=17"><link rel="stylesheet" href="/create-plan.css?v=63"><script src="/nutrition-theme.js?v=2"></script><link rel="stylesheet" href="/nutrition-theme.css?v=5"><link rel="stylesheet" href="/tm-design-system.css?v=13"></head><body><div class="tm-library-layout"><aside class="tm-admin-sidebar" aria-label="Navegação do Backoffice" data-tm-nav-page="create-plan"></aside><main class="shell"><div id="plan-entry" class="plan-library"><div class="plan-library-actions"><button id="entry-create" type="button" class="entry-choice tm-action-new"><span class="entry-icon" aria-hidden="true">+</span><span>Criar novo</span></button></div><div class="plan-library-filters"><label class="plan-library-search-label"><span class="sr-only">Pesquisar plano</span><input id="library-plan-search" type="search" placeholder="Pesquisar jogador ou tipo de plano..." autocomplete="off" aria-label="Pesquisar plano"></label><label><span class="sr-only">Filtrar jogador</span><select id="library-player-filter" aria-label="Jogador"><option value="">Todos os jogadores</option></select></label><label><span class="sr-only">Filtrar tipo de plano</span><select id="library-type-filter" aria-label="Tipo de plano"><option value="">Todos os tipos de plano</option></select></label></div><div class="plan-library-table-wrap"><div class="plan-library-table-heading"><span id="library-plan-count"></span></div><table class="plan-library-table"><thead><tr><th>Nome</th><th>Plano</th><th>Estado</th><th>Ações</th></tr></thead><tbody id="library-plan-rows"><tr><td colspan="4">A carregar planos...</td></tr></tbody></table></div></div><div id="plan-search-selection" hidden><button class="plan-back" id="back-from-search" type="button" aria-label="Voltar a Planos" title="Voltar">←</button><div class="plan-search-field"><input id="search-player" type="search" placeholder="Pesquisar jogador" aria-label="Pesquisar jogador" autocomplete="off"><button id="search-player-toggle" type="button" class="search-player-toggle" aria-label="Mostrar jogadores" aria-expanded="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg></button></div><div id="search-player-results" class="search-player-results"></div><select id="search-plan-type" aria-label="Tipo de plano guardado" disabled><option value="">Selecionar tipo de plano</option></select></div><select id="draft-list" hidden aria-label="Planos guardados"><option value="">Selecionar plano guardado</option></select><div id="plan-preview" hidden><div class="plan-preview-toolbar"><button id="preview-back" type="button" class="plan-back" aria-label="Voltar aos planos">←</button><button id="preview-edit" type="button" class="plan-preview-edit">Editar plano</button></div><div id="plan-preview-content"></div></div><div id="plan-editor" hidden><div class="plan-editor-heading"><button class="plan-back" id="back-from-editor" type="button" aria-label="Voltar a Planos" title="Voltar">←</button><span id="plan-state-chip" class="plan-state-chip" data-state="new">Por guardar</span></div><div class="plan-overview"><section class="planhead plan-selectors"><label><span class="sr-only">Jogador</span><select id="plan-player" aria-label="Jogador"><option value="">Selecionar jogador</option></select></label><label><span class="sr-only">Tipo de plano</span><select id="plan-type" aria-label="Tipo de plano"><option value="">Selecionar tipo de plano</option><option value="Plano laranja">Plano laranja</option><option value="Plano amarelo">Plano amarelo</option><option value="Plano azul">Plano azul</option><option value="Plano verde">Plano verde</option><option value="Plano verde preparação">Plano verde preparação</option><option value="Plano Peri-jogo">Plano Peri-jogo</option><option value="Plano Peri-treino">Plano Peri-treino</option><option value="Plano geral">Plano geral</option></select></label></section><section class="stats four" aria-label="Resumo nutricional do plano"><div class="stat energy"><span class="stat-label">kcal</span><div class="stat-value"><strong id="total-kcal">0</strong></div><small class="plan-perkg" id="total-kcal-kg"></small></div><div class="stat"><span class="stat-label">Proteína</span><div class="stat-value"><strong id="total-p">0</strong><small>g</small></div><small class="plan-perkg" id="total-p-kg"></small></div><div class="stat"><span class="stat-label">Hidratos</span><div class="stat-value"><strong id="total-hc">0</strong><small>g</small></div><small class="plan-perkg" id="total-hc-kg"></small></div><div class="stat"><span class="stat-label">Gordura</span><div class="stat-value"><strong id="total-g">0</strong><small>g</small></div><small class="plan-perkg" id="total-g-kg"></small></div><small class="plan-weight-reference" id="plan-weight-reference" role="status"></small></section></div><div id="meals"></div><div id="meal-picker" class="meal-picker" hidden><strong>Selecionar refeição</strong><div id="meal-choices" class="meal-choices"></div><button id="cancel-meal" type="button" aria-label="Fechar seleção de refeição" title="Fechar">×</button></div><div id="plan-save-feedback" class="plan-save-feedback" data-state="new" role="status" aria-live="polite" aria-atomic="true">

 <span class="plan-save-feedback-copy"><strong id="plan-save-feedback-title">Novo plano por guardar</strong><small id="plan-save-feedback-description">Guarda o plano para depois poderes publicá-lo no Planeamento.</small></span>
