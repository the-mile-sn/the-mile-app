<!doctype html>
<html lang="pt-PT">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>The Mile</title>
  <style>html,body{margin:0;width:100%;height:100%;background:#000;color-scheme:dark}</style>
</head>
<body>
<script>
(async()=>{
  const id=new URLSearchParams(location.search).get('id');
  if(!id){ history.back(); return; }
  try{
    const r=await fetch('/api/documents/'+encodeURIComponent(id),{credentials:'same-origin'});
    if(!r.ok) throw new Error('pdf');
    const blob=await r.blob();
    const url=URL.createObjectURL(blob);
    location.replace(url);
  }catch(e){ history.back(); }
})();
</script>
</body>
</html>
