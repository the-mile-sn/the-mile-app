name: Validate player-added Jogo timings
on:
  pull_request:
    branches: [main]
    paths:
      - 'app.py'
      - 'consumption_timing_v2.py'
      - 'consumption_records_v2.py'
      - 'test_consumption_added_timing_v2.py'
      - 'tests/player-i18n-consumption-events.test.cjs'
      - 'static/jogador-v2.js'
      - 'static/jogador-v2.css'
      - '.github/workflows/validate-player-added-timing.yml'
  workflow_dispatch:
jobs:
  validate-added-timing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compile Python consumption modules
        run: python -m py_compile app.py consumption_timing_v2.py consumption_records_v2.py consumption_nutrition_v2.py test_consumption_added_timing_v2.py
      - name: Check player JS syntax
        run: node --check static/jogador-v2.js
      - name: Validate Portuguese and English consumption and event labels
        run: node --test tests/player-i18n-consumption-events.test.cjs
      - name: Verify extra timing, existing timing and legacy calculations
        run: python -m unittest -v test_consumption_added_timing_v2 test_consumption_timing_v2 test_consumption_timing_ui_contract
