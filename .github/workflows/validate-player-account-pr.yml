name: Validate V2 player account pull request
on:
  pull_request:
    branches:
      - production/the-mile-admin
    paths:
      - app.py
      - microcycles_v2.py
      - static/admin-microcycles.js
      - static/admin-microcycles.html
      - test_player_account_creation_v2.py
      - .github/workflows/validate-player-account-pr.yml
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Python syntax
        run: python -m compileall -q app.py microcycles_v2.py test_player_account_creation_v2.py
      - name: JavaScript syntax
        run: node --check static/admin-microcycles.js
      - name: Run account creation tests
        run: python -m unittest -v test_player_account_creation_v2
