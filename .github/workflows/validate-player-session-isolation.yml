name: Validate player session isolation
on:
  push:
    branches: [fix/player-account-session-cache-isolation-20261030]
  pull_request:
    branches: [main]
jobs:
  regression:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - run: node --check static/jogador-v2.js
      - run: node --test tests/player-session-isolation.test.cjs tests/player-weight-navigation.test.cjs
      - run: python -m unittest -v test_player_sex_source_v2 test_reference_weight_v2
