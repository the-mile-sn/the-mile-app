name: Validate native Planos integration
on:
  pull_request:
    branches: [production/the-mile-admin]
jobs:
  native-plan-regression:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: |
          node --check static/admin-dashboard.js
          node --check static/admin-nav-shell.js
          node --check static/create-plan.js
      - name: Verify Planos native contract
        run: node --test tests/admin-plans-native.test.cjs
      - name: Verify production WSGI serves Planos CSS with correct content type
        run: |
          python -m pip install -r requirements.txt
          python - <<'PY'
          import os
          from io import BytesIO
          os.environ["MILE_SITE_ROLE"]="admin"
          import app
          def request(path,query,role):
              app.SITE_ROLE=role
              out={}
              def start(status,headers):
                  out["status"]=status
                  out["headers"]=dict(headers)
              env={"REQUEST_METHOD":"GET","PATH_INFO":path,"QUERY_STRING":query,
                   "wsgi.input":BytesIO(b""),"SERVER_NAME":"localhost","SERVER_PORT":"8765",
                   "wsgi.url_scheme":"http","wsgi.version":(1,0),"wsgi.errors":BytesIO(),
                   "wsgi.multithread":False,"wsgi.multiprocess":False,"wsgi.run_once":False}
              out["body"]=b"".join(app.application(env,start))
              return out
          css=request("/admin-plans-native.css","v=3","admin")
          assert css["status"]=="200 OK",css["status"]
          assert css["headers"]["Content-Type"].startswith("text/css"),css["headers"]
          assert len(css["body"])>140000
          assert b"#tm-plan-page .plan-library-filters" in css["body"]
          assert "immutable" in css["headers"]["Cache-Control"]
          page=request("/","","admin")
          assert page["status"]=="200 OK"
          assert b"/admin-plans-native.css?v=3" in page["body"]
          blocked=request("/admin-plans-native.css","v=3","player")
          assert blocked["status"]=="404 Not Found",blocked["status"]
          print("PASS: Real WSGI serves native Planos CSS, with browser cache version and role isolation")
          PY
      - name: Install Chromium and WebKit for visual regressions
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium webkit
      - name: Test Planos navigation and unsaved state in Chromium
        run: |
          python -m http.server 8765 --bind 127.0.0.1 --directory static > /tmp/the-mile-plans-native-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          node --test tests/admin-plans-native-browser.test.cjs
      - name: Upload Planos light/dark/mobile screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-planos-desktop-mobile-screenshots
          path: |
            plans-native-dark.png
            plans-native-light.png
            plans-native-mobile.png
            plans-native-webkit-list.png
            plans-native-webkit-editor.png
          if-no-files-found: ignore
