name: Vendor Inter Tight fonts for PDF
on:
  push:
    branches: [feature/pdf-intertight-layout]
    paths: [.github/workflows/vendor-intertight-pdf.yml]
permissions:
  contents: write
jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Download pinned upstream font files
        run: |
          mkdir -p static/fonts
          curl -fL --retry 3 -o static/fonts/InterTight-Regular.ttf https://raw.githubusercontent.com/googlefonts/inter-gf-tight/main/fonts/ttf/InterTight-Regular.ttf
          curl -fL --retry 3 -o static/fonts/InterTight-Bold.ttf https://raw.githubusercontent.com/googlefonts/inter-gf-tight/main/fonts/ttf/InterTight-Bold.ttf
          curl -fL --retry 3 -o static/fonts/OFL.txt https://raw.githubusercontent.com/googlefonts/inter-gf-tight/main/OFL.txt
          test "$(wc -c < static/fonts/InterTight-Regular.ttf)" -gt 300000
          test "$(wc -c < static/fonts/InterTight-Bold.ttf)" -gt 300000
      - name: Commit bundled fonts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add static/fonts/InterTight-Regular.ttf static/fonts/InterTight-Bold.ttf static/fonts/OFL.txt
          git commit -m "Vendor OFL Inter Tight font assets for PDFs"
          git push origin HEAD:feature/pdf-intertight-layout
