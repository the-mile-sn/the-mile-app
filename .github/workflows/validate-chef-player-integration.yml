name: Validate Chef player integration
on:
  push:
    branches: [feature/chef-player-app-integration]
  pull_request:
    branches: [main]
jobs:
  player-chef-regression:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest -v test_chef_player_integration test_app tests.test_food_plan_player_v2
      - run: node --check static/chef.js
      - run: node --check static/jogador-v2.js
