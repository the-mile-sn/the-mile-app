name: Validate clinical dashboard and forms matrix
on:
  push:
    branches: [feature/admin-assessment-priority-one-chart-forms-table-20261030]
  pull_request:
    branches: [production/the-mile-admin]
jobs:
  regression:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - run: node --check static/admin-microcycles.js
      - run: node --check static/admin-dashboard.js
      - run: node --test tests/admin-assessments-forms-refresh.test.cjs tests/admin-clinical-navigation.test.cjs
      - run: python -m unittest -v test_player_account_creation_v2
