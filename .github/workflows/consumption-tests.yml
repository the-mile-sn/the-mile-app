name: Consumption nutrition regression tests

on:
  push:
    branches:
      - feature/nutrition-consumption-records
  pull_request:
    paths:
      - 'consumption_nutrition_v2.py'
      - 'consumption_records_v2.py'
      - 'meal_option_selection_v2.py'
      - 'test_consumption_persistence_v2.py'
      - 'static/jogador-v2.js'
      - 'static/admin-microcycles.js'
      - 'static/jogador-v2.css'
      - 'static/admin-microcycles.css'
      - 'static/admin-microcycles.html'
      - 'test_consumption_nutrition_v2.py'
      - '.github/workflows/consumption-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nutrition-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate JavaScript syntax
        run: |
          node --check static/jogador-v2.js
          node --check static/admin-microcycles.js
      - name: Compile nutrition module and regression tests
        run: python -m py_compile consumption_nutrition_v2.py consumption_records_v2.py meal_option_selection_v2.py test_consumption_nutrition_v2.py test_consumption_persistence_v2.py
      - name: Run nutrition regression tests
        run: python -m unittest -v test_consumption_nutrition_v2.py test_consumption_persistence_v2.py
