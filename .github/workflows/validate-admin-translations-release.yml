name: Validate Backoffice-only PT EN translations pilot

on:
  push:
    branches:
      - "feature/backoffice-translations-release-*"
      - "fix/backoffice-translations-coverage-*"
    paths:
      - "app.py"
      - "admin_translations_http_v2.py"
      - "content_translations_v2.py"
      - "app_translation_admin_v2.py"
      - "app_translation_catalog_v2.py"
      - "app_translation_import_v2.py"
      - "app_translation_batch_review_v2.py"
      - "app_translation_sources_v2.py"
      - "app_translation_plans_v2.py"
      - "test_admin_translation_plans_v2.py"
      - "static/admin-translations*"
      - "static/admin-microcycles.html"
      - "static/admin-microcycles.js"
      - "static/admin-dashboard.js"
      - "static/admin-nav-shell.js"
      - "tests/admin_translations_embedded_browser.mjs"
      - "test_admin_translations_release_v2.py"
      - "test_admin_translation_import_v2.py"
      - "test_admin_translation_batch_review_v2.py"
      - "tests/admin_translations_batch_browser.mjs"
      - "tests/admin_translations_browser.mjs"
      - ".github/workflows/validate-admin-translations-release.yml"
  pull_request:
    paths:
      - "app.py"
      - "admin_translations_http_v2.py"
      - "content_translations_v2.py"
      - "app_translation_admin_v2.py"
      - "app_translation_catalog_v2.py"
      - "app_translation_import_v2.py"
      - "app_translation_batch_review_v2.py"
      - "app_translation_sources_v2.py"
      - "app_translation_plans_v2.py"
      - "test_admin_translation_plans_v2.py"
      - "static/admin-translations*"
      - "static/admin-microcycles.html"
      - "static/admin-microcycles.js"
      - "static/admin-dashboard.js"
      - "static/admin-nav-shell.js"
      - "tests/admin_translations_embedded_browser.mjs"
      - "test_admin_translations_release_v2.py"
      - "test_admin_translation_import_v2.py"
      - "test_admin_translation_batch_review_v2.py"
      - "tests/admin_translations_batch_browser.mjs"
      - "tests/admin_translations_browser.mjs"
      - ".github/workflows/validate-admin-translations-release.yml"

jobs:
  app-regression:
    runs-on: ubuntu-latest
    env:
      MILE_BACKOFFICE_TRANSLATIONS_ENABLED: "0"
      MILE_APP_TRANSLATIONS_ENABLED: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install existing Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile backend and validate browser scripts
        run: |
          python -m py_compile app.py admin_translations_http_v2.py content_translations_v2.py app_translation_admin_v2.py app_translation_catalog_v2.py app_translation_sources_v2.py app_translation_import_v2.py app_translation_batch_review_v2.py app_translation_plans_v2.py test_admin_translation_plans_v2.py
          node --check static/admin-translations.js
          node --check static/admin-translations-plans.js
          node --check static/admin-translations-import.js
          node --check static/admin-translations-shortcuts.js
          node --check static/admin-dashboard.js
          node --check static/admin-microcycles.js
          node --check static/admin-nav-shell.js
          node --check tests/admin_translations_embedded_browser.mjs
          node --check tests/admin_translations_batch_browser.mjs
      - name: Run real WSGI tests (auth, CSRF, catalog, no app routes)
        run: python -m unittest -v test_admin_translations_release_v2 test_admin_translation_import_v2 test_admin_translation_batch_review_v2 test_admin_translation_plans_v2

  browser-mock:
    runs-on: ubuntu-24.04
    needs: app-regression
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install isolated browser test dependency
        run: |
          npm install --no-save playwright@1.58.0
          npx playwright install --with-deps chromium
      - name: Serve only static files, never application data
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 --directory static > /tmp/the-mile-i18n-http.log 2>&1 &
          for i in 1 2 3 4 5; do
            curl -fsS http://127.0.0.1:8765/admin-translations.html > /dev/null && break
            sleep 1
          done
      - name: Exercise review flow at desktop and mobile widths
        run: |
          node tests/admin_translations_browser.mjs
          node tests/admin_translations_embedded_browser.mjs
          node tests/admin_translations_batch_browser.mjs
      - name: Store mock-data layout evidence for visual review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backoffice-pt-en-mock-preview
          path: /tmp/backoffice-translations-*-MOCK.png
          if-no-files-found: ignore
