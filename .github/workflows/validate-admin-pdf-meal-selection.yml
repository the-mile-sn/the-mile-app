name: Validate PDF meal selection
on:
  push:
    branches: [feature/admin-pdf-meal-selection]
  pull_request:
    paths:
      - 'food_plan_pdf_export_v2.py'
      - 'test_food_plan_pdf_export_v2.py'
      - 'static/create-plan.js'
      - 'app.py'
      - 'static/admin-microcycles.html'
      - 'static/admin-plans-native.css'
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest -v test_food_plan_pdf_export_v2.py
      - run: python -m py_compile app.py food_plan_pdf_export_v2.py
      - run: node --check static/create-plan.js
