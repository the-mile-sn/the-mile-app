name: Validate appointments safe Shopify webhook smoke
on:
  push:
    branches:
      - feature/appointments-safe-webhook-smoke-20261114
  pull_request:
    branches:
      - production/the-mile-admin
jobs:
  appointments-catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: mile_test
          POSTGRES_PASSWORD: mile_test
          POSTGRES_DB: mile_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mile_test -d mile_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt
      - name: Python syntax
        run: python -m py_compile app.py appointments_catalog_v2.py appointments_availability_v2.py appointments_bookings_v2.py appointments_google_v2.py appointments_checkout_v2.py appointments_shopify_bridge_v2.py appointments_shopify_registration_v2.py appointments_shopify_smoke_v2.py appointments_shopify_paid_booking_smoke_v2.py appointments_launch_readiness_v2.py test_appointments_launch_readiness_v2.py test_appointments_shopify_paid_booking_smoke_v2.py test_appointments_shopify_smoke_v2.py test_appointments_shopify_registration_v2.py test_appointments_shopify_bridge_v2.py appointments_assignment_v2.py appointments_storefront_preview_v2.py test_appointments_storefront_preview_v2.py test_appointments_google_v2.py test_appointments_checkout_v2.py test_appointments_catalog_v2.py test_appointments_availability_v2.py test_appointments_bookings_v2.py
      - name: JavaScript syntax
        run: |
          node --check static/admin-appointments.js
          node --check static/admin-appointments-schedule.js
          node --check static/admin-appointments-bookings.js
          node --check static/admin-appointments-google.js
      - name: Appointments API and security regression
        run: python -m unittest -v test_appointments_catalog_v2 test_appointments_availability_v2 test_appointments_bookings_v2 test_appointments_google_v2 test_appointments_checkout_v2 test_appointments_shopify_smoke_v2 test_appointments_shopify_paid_booking_smoke_v2 test_appointments_shopify_registration_v2 test_appointments_shopify_bridge_v2 test_appointments_launch_readiness_v2 test_appointments_storefront_preview_v2 test_appointments_backoffice_shell
      - name: PostgreSQL 18 compatibility and catalogue smoke
        env:
          DATABASE_URL: postgresql://mile_test:mile_test@localhost:5432/mile_test
        run: |
          python - <<'PY'
          import app
          import appointments_catalog_v2 as catalogue
          import appointments_availability_v2 as availability
          with app.connect() as c:
              catalogue.initialize(c)
              availability.initialize(c)
              first = catalogue.catalog(c)
              assert len(first['services']) == 4
              name = catalogue.save_professional(c, {
                  'name':'PG Test','email':'test@pg.example','active':True,
                  'presencial_enabled':True,'online_enabled':False,
                  'service_ids':[first['services'][0]['id']]
              })
          with app.connect() as c:
              catalogue.initialize(c)
              second = catalogue.catalog(c)
              assert len(second['services']) == 4
              assert any(p['id'] == name for p in second['professionals'])
              assert any(name in s['professional_ids'] for s in second['services'])
              day = '2026-12-10'
              availability.save_period(c,'availability',{
                  'professional_id':name, 'date':day,
                  'start':'09:00','end':'13:00'
              })
              availability.save_period(c,'block',{
                  'professional_id':name,'date':day,
                  'start':'10:00','end':'11:00','note':'PG test'
              })
          with app.connect() as c:
              schedule = availability.periods(c,catalogue.ORG_ID,name,day,day)
              assert len(schedule['availability']) == 1
              assert len(schedule['blocks']) == 1
              assert schedule['blocks'][0]['note'] == 'PG test'
          PY

      - name: PostgreSQL 18 simultaneous booking regression
        env:
          DATABASE_URL: postgresql://mile_test:mile_test@localhost:5432/mile_test
        run: |
          python - <<'PY'
          import concurrent.futures
          from datetime import datetime, timedelta
          from zoneinfo import ZoneInfo
          import app
          import appointments_catalog_v2 as catalogue
          import appointments_availability_v2 as availability
          import appointments_bookings_v2 as bookings
          import appointments_google_v2 as google
          import appointments_checkout_v2 as checkout
          import appointments_shopify_bridge_v2 as shopify_bridge

          day=(datetime.now(ZoneInfo("Europe/Lisbon")).date()+timedelta(days=2)).isoformat()
          with app.connect() as c:
              bookings.initialize(c)
              google.initialize(c)
              checkout.initialize(c)
              shopify_bridge.initialize(c)
              service=next(s for s in catalogue.catalog(c)['services']
                           if s['duration_minutes']==90)
              person=catalogue.save_professional(c,{
                  'name':'Concurrency QA','email':'concurrency@ci.invalid','active':True,
                  'presencial_enabled':True,'online_enabled':True,'service_ids':[service['id']]
              })
              availability.save_period(c,'availability',{
                  'professional_id':person,'date':day,'start':'09:00','end':'13:00'
              })
          payload={
              'professional_id':person, 'service_id':service['id'],
              'mode':'presencial','date':day,'start':'09:00',
              'customer_name':'CI Booking','customer_email':'',
              'customer_phone':''
          }
          def attempt(i):
              try:
                  with app.connect() as c:
                      return ('created',bookings.create(c,payload,'ci'))
              except ValueError as exc:
                  return ('rejected',str(exc))
          with concurrent.futures.ThreadPoolExecutor(max_workers=2) as pool:
              results=list(pool.map(attempt,[1,2]))
          assert len([r for r in results if r[0]=='created'])==1,results
          assert ('rejected','booking_overlap') in results,results
          with app.connect() as c:
              rows=c.execute("SELECT COUNT(*) AS n FROM appt_bookings WHERE org_id=? AND professional_id=? AND status='scheduled'",
                             (catalogue.ORG_ID,person)).fetchone()
              assert rows['n']==1
          print("Concurrent writers: exactly one appointment persisted",results)
          PY

      - name: PostgreSQL 18 simultaneous checkout hold and manual booking regression
        env:
          DATABASE_URL: postgresql://mile_test:mile_test@localhost:5432/mile_test
        run: |
          python - <<'PY'
          import concurrent.futures
          from datetime import datetime, timedelta
          from zoneinfo import ZoneInfo
          import app
          import appointments_catalog_v2 as catalog
          import appointments_availability_v2 as availability
          import appointments_checkout_v2 as checkout
          import appointments_bookings_v2 as bookings

          day=(datetime.now(ZoneInfo("Europe/Lisbon")).date()+timedelta(days=2)).isoformat()
          with app.connect() as c:
              p=catalog.save_professional(c,{
                  'name':'Checkout Race CI','email':'hold-race@ci.invalid','active':True,
                  'presencial_enabled':True,'online_enabled':True,
                  'service_ids':[catalog.catalog(c)['services'][0]['id']]
              })
              service=catalog.catalog(c)['services'][0]
              availability.save_period(c,'availability',{
                  'professional_id':p,'date':day,'start':'09:00','end':'13:00'
              })
          payload={'professional_id':p,'service_id':service['id'],
                   'mode':'presencial','date':day,'start':'09:00'}
          def contender(i):
              try:
                  with app.connect() as c:
                      return ('held',checkout.start_hold(
                          c,{**payload,'idempotency_key':'ci-checkout-race-'+str(i)+'-2026'},'ci'))
              except ValueError as e:
                  return ('rejected',str(e))
          with concurrent.futures.ThreadPoolExecutor(max_workers=2) as pool:
              results=list(pool.map(contender,[1,2]))
          assert len([r for r in results if r[0]=='held'])==1,results
          assert ('rejected','checkout_hold_conflict') in results,results
          with app.connect() as c:
              n=c.execute("""SELECT COUNT(*) AS n FROM appt_checkout_holds
                  WHERE org_id=? AND professional_id=? AND status='held'""",
                  (catalog.ORG_ID,p)).fetchone()['n']
              assert n==1,n
          try:
              with app.connect() as c:
                  bookings.create(c,{**payload,'customer_name':'Must Fail'},'ci')
          except ValueError as e:
              assert str(e)=='checkout_hold_conflict',str(e)
          else:
              raise AssertionError('Manual booking bypassed an active checkout hold')
          print('Concurrent checkout holds: one held; second rejected; manual conflict protected')
          PY

      - name: PostgreSQL 18 simultaneous any-professional checkout assignment
        env:
          DATABASE_URL: postgresql://mile_test:mile_test@localhost:5432/mile_test
        run: |
          python - <<'PY'
          import concurrent.futures
          from datetime import datetime, timedelta
          from zoneinfo import ZoneInfo
          import app
          import appointments_catalog_v2 as catalog
          import appointments_availability_v2 as availability
          import appointments_checkout_v2 as checkout

          day=(datetime.now(ZoneInfo('Europe/Lisbon')).date()+timedelta(days=3)).isoformat()
          with app.connect() as c:
              svc=next(s for s in catalog.catalog(c)['services'] if s['duration_minutes']==90)
              names=[]
              for index in (1,2):
                  pid=catalog.save_professional(c,{
                      'name':'Auto Assignment QA '+str(index),
                      'email':'auto-'+str(index)+'@ci.invalid','active':True,
                      'presencial_enabled':True,'online_enabled':True,
                      'service_ids':[svc['id']]
                  })
                  availability.save_period(c,'availability',{
                      'professional_id':pid,'date':day,
                      'start':'09:00','end':'13:00'
                  })
                  names.append(pid)
          selected={'professional_id':'any','service_id':svc['id'],
                    'mode':'presencial','date':day,'start':'09:00'}
          def attempt(n):
              with app.connect() as c:
                  return checkout.start_hold(c,{
                      **selected,'idempotency_key':'auto-race-2026-checkout-'+str(n)
                  },'ci')['professional_id']
          with concurrent.futures.ThreadPoolExecutor(max_workers=2) as pool:
              assigned=list(pool.map(attempt,[1,2]))
          assert set(assigned)==set(names),('Expected both professionals assigned',assigned,names)
          try:
              with app.connect() as c:
                  checkout.start_hold(c,{
                      **selected,'idempotency_key':'auto-race-2026-checkout-third'
                  },'ci')
          except ValueError as error:
              assert str(error)=='slot_no_longer_available',str(error)
          else:
              raise AssertionError('Third simultaneous hold accepted despite no capacity')
          print('Atomic automatic assignment: two distinct professionals, third rejected')
          PY

      - name: PostgreSQL 18 synthetic signed Shopify webhook leaves no changes
        env:
          DATABASE_URL: postgresql://mile_test:mile_test@localhost:5432/mile_test
          MILE_SHOPIFY_APP_SECRET: test-signing-secret-for-ci-only-2026-00000
          MILE_SHOPIFY_WEBHOOK_ENABLED: '1'
          MILE_SHOPIFY_SHOP_DOMAIN: the-mile-sports-nutrition.myshopify.com
          MILE_SHOPIFY_CHECKOUT_ENABLED: '0'
          MILE_SHOPIFY_SESAMI_MIGRATED: '0'
        run: |
          python - <<'PY'
          import app
          import appointments_shopify_bridge_v2 as bridge
          import appointments_shopify_smoke_v2 as smoke
          with app.connect() as c:
              bridge.initialize(c)
              before=c.execute(
                  "SELECT COUNT(*) AS n FROM appt_shopify_webhook_deliveries"
              ).fetchone()["n"]
              result=smoke.run_signed_smoke(c)
              after=c.execute(
                  "SELECT COUNT(*) AS n FROM appt_shopify_webhook_deliveries"
              ).fetchone()["n"]
          assert result["signature_accepted"] and result["unrelated_order_ignored"],result
          assert result["forged_signature_rejected"] and result["duplicate_delivery_idempotent"],result
          assert not result["database_changes_persisted"],result
          assert before==after,(before,after)
          print("PostgreSQL smoke passed: signature + replay + rollback; no payment or booking")
          PY
