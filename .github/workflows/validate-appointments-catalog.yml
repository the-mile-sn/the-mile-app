name: Validate appointments catalog phase 2
on:
  push:
    branches:
      - feature/appointments-services-professionals-20261113
  pull_request:
    branches:
      - production/the-mile-admin
jobs:
  appointments-catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt
      - name: Python syntax
        run: python -m py_compile app.py appointments_catalog_v2.py test_appointments_catalog_v2.py
      - name: JavaScript syntax
        run: node --check static/admin-appointments.js
      - name: Appointments API and security regression
        run: python -m unittest -v test_appointments_catalog_v2 test_appointments_backoffice_shell
