name: Validate appointments and monthly booking calendar
on:
  push:
    branches:
      - feature/appointments-month-calendar-20261113
  pull_request:
    branches:
      - production/the-mile-admin
jobs:
  appointments-catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: mile_test
          POSTGRES_PASSWORD: mile_test
          POSTGRES_DB: mile_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mile_test -d mile_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt
      - name: Python syntax
        run: python -m py_compile app.py appointments_catalog_v2.py appointments_availability_v2.py appointments_bookings_v2.py test_appointments_catalog_v2.py test_appointments_availability_v2.py test_appointments_bookings_v2.py
      - name: JavaScript syntax
        run: |
          node --check static/admin-appointments.js
          node --check static/admin-appointments-schedule.js
          node --check static/admin-appointments-bookings.js
      - name: Appointments API and security regression
        run: python -m unittest -v test_appointments_catalog_v2 test_appointments_availability_v2 test_appointments_bookings_v2 test_appointments_backoffice_shell
      - name: PostgreSQL 18 compatibility and catalogue smoke
        env:
          DATABASE_URL: postgresql://mile_test:mile_test@localhost:5432/mile_test
        run: |
          python - <<'PY'
          import app
          import appointments_catalog_v2 as catalogue
          import appointments_availability_v2 as availability
          with app.connect() as c:
              catalogue.initialize(c)
              availability.initialize(c)
              first = catalogue.catalog(c)
              assert len(first['services']) == 4
              name = catalogue.save_professional(c, {
                  'name':'PG Test','email':'test@pg.example','active':True,
                  'presencial_enabled':True,'online_enabled':False,
                  'service_ids':[first['services'][0]['id']]
              })
          with app.connect() as c:
              catalogue.initialize(c)
              second = catalogue.catalog(c)
              assert len(second['services']) == 4
              assert any(p['id'] == name for p in second['professionals'])
              assert any(name in s['professional_ids'] for s in second['services'])
              day = '2026-12-10'
              availability.save_period(c,'availability',{
                  'professional_id':name, 'date':day,
                  'start':'09:00','end':'13:00'
              })
              availability.save_period(c,'block',{
                  'professional_id':name,'date':day,
                  'start':'10:00','end':'11:00','note':'PG test'
              })
          with app.connect() as c:
              schedule = availability.periods(c,catalogue.ORG_ID,name,day,day)
              assert len(schedule['availability']) == 1
              assert len(schedule['blocks']) == 1
              assert schedule['blocks'][0]['note'] == 'PG test'
          PY

      - name: PostgreSQL 18 simultaneous booking regression
        env:
          DATABASE_URL: postgresql://mile_test:mile_test@localhost:5432/mile_test
        run: |
          python - <<'PY'
          import concurrent.futures
          from datetime import datetime, timedelta
          from zoneinfo import ZoneInfo
          import app
          import appointments_catalog_v2 as catalogue
          import appointments_availability_v2 as availability
          import appointments_bookings_v2 as bookings

          day=(datetime.now(ZoneInfo("Europe/Lisbon")).date()+timedelta(days=2)).isoformat()
          with app.connect() as c:
              bookings.initialize(c)
              service=next(s for s in catalogue.catalog(c)['services']
                           if s['duration_minutes']==90)
              person=catalogue.save_professional(c,{
                  'name':'Concurrency QA','email':'concurrency@ci.invalid','active':True,
                  'presencial_enabled':True,'online_enabled':True,'service_ids':[service['id']]
              })
              availability.save_period(c,'availability',{
                  'professional_id':person,'date':day,'start':'09:00','end':'13:00'
              })
          payload={
              'professional_id':person, 'service_id':service['id'],
              'mode':'presencial','date':day,'start':'09:00',
              'customer_name':'CI Booking','customer_email':'',
              'customer_phone':''
          }
          def attempt(i):
              try:
                  with app.connect() as c:
                      return ('created',bookings.create(c,payload,'ci'))
              except ValueError as exc:
                  return ('rejected',str(exc))
          with concurrent.futures.ThreadPoolExecutor(max_workers=2) as pool:
              results=list(pool.map(attempt,[1,2]))
          assert len([r for r in results if r[0]=='created'])==1,results
          assert ('rejected','booking_overlap') in results,results
          with app.connect() as c:
              rows=c.execute("SELECT COUNT(*) AS n FROM appt_bookings WHERE org_id=? AND professional_id=? AND status='scheduled'",
                             (catalogue.ORG_ID,person)).fetchone()
              assert rows['n']==1
          print("Concurrent writers: exactly one appointment persisted",results)
          PY
