name: Player daily-card geometry contract

on:
  push:
    branches:
      - main
    paths:
      - 'static/jogador-v2.css'
      - 'static/jogador-v2.js'
      - 'static/jogador-v2.html'
      - 'docs/GUIA_VISUAL_APP_JOGADORES.md'
      - 'test_player_daily_card_geometry.py'
      - 'events_v2.py'
      - 'tests/test_peri_events_v2.py'
      - 'tests/player-event-reschedule.test.cjs'
      - '.github/workflows/validate-player-daily-cards.yml'
  workflow_dispatch:

jobs:
  header-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check player JavaScript syntax
        run: node --check static/jogador-v2.js
      - name: Verify universal day-card geometry and visual-guide parity
        run: python -m unittest -v test_player_daily_card_geometry
      - name: Verify player event edits, cache invalidation and morning/afternoon positioning
        run: node --test tests/player-event-reschedule.test.cjs
      - name: Verify persisted event schedules and peri-meal sessions
        run: python -m unittest discover -s tests -p 'test_peri_events_v2.py' -v
