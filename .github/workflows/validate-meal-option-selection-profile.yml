name: Validate opt-in meal option selection profile
on:
  pull_request:
    branches: [production/the-mile-admin]
    paths:
      - app.py
      - microcycles_v2.py
      - static/admin-dashboard.js
      - static/admin-microcycles.html
      - test_meal_option_selection_profile_v2.py
      - .github/workflows/validate-meal-option-selection-profile.yml
  workflow_dispatch:
jobs:
  profile-contract:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Python syntax
        run: python -m compileall -q app.py microcycles_v2.py test_meal_option_selection_profile_v2.py
      - name: JavaScript syntax
        run: node --check static/admin-dashboard.js
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Validate opt-in default, profile save, legacy compatibility, and permissions
        run: python -m unittest -v test_meal_option_selection_profile_v2
