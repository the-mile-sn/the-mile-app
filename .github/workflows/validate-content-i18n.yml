name: Validate opt-in approved Planos read-only translations
on:
  pull_request:
    branches: [main]
    paths:
      - app_content_i18n_v2.py
      - food_plan_player_v2.py
      - app.py
      - static/chef.js
      - test_app_content_i18n_v2.py
      - .github/workflows/validate-content-i18n.yml
  workflow_dispatch:
jobs:
  approved-only-presentation:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest -v test_app_content_i18n_v2 tests.test_food_plan_player_v2 test_chef_player_integration
      - run: python -m py_compile app_content_i18n_v2.py food_plan_player_v2.py app.py
      - run: node --check static/chef.js
