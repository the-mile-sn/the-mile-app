name: Validate consult clients (phase 1)
on:
  pull_request:
    branches: [production/the-mile-admin]
jobs:
  consult-clients:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest -v test_consult_clients_v2 test_appointments_bookings_v2 test_appointments_catalog_v2
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node --check static/admin-consult-clients.js
      - run: node --check static/admin-clients.js
