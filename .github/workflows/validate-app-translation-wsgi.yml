name: Verify PT-EN WSGI integration (feature off)

on:
  push:
    branches:
      - "feature/app-translation-foundation-*"
    paths:
      - "app.py"
      - "app_translation_http_v2.py"
      - "test_app_translation_wsgi_v2.py"
      - ".github/workflows/validate-app-translation-wsgi.yml"
  pull_request:
    paths:
      - "app.py"
      - "app_translation_http_v2.py"
      - "test_app_translation_wsgi_v2.py"
      - ".github/workflows/validate-app-translation-wsgi.yml"

jobs:
  wsgi-smoke:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      MILE_APP_TRANSLATIONS_ENABLED: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install existing app dependencies
        run: python -m pip install -r requirements.txt
      - name: Exercise real WSGI cookies, origin, CSRF and language routes
        run: python -m unittest -v test_app_translation_wsgi_v2
