name: Smoke test isolated native Food Library preview
on:
  push:
    branches: [feature/food-library-v1-isolated]
  workflow_dispatch:
jobs:
  remote-preview:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Verify public preview is isolated and assets load
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://the-mile-food-library-test.onrender.com"
          curl --retry 5 --retry-delay 5 --retry-all-errors --max-time 45 -fsS "$BASE/__preview_meta" -o /tmp/tm-preview.json
          python -c 'import json; a=json.load(open("/tmp/tm-preview.json")); assert a["preview"] is True and a["data"]=="simulated" and a["prod_database"] is False, a'
          curl --retry 5 --retry-delay 5 --retry-all-errors --max-time 45 -fsS "$BASE/?nav=food-library" -o /tmp/tm-preview.html
          grep -q 'id="tm-food-library-page"' /tmp/tm-preview.html
          curl -fsS "$BASE/food-library.js?v=13" | grep -q 'tmEnsureAdminFoodLibrary'
      - name: Install Chromium for browser regression
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Validate live preview navigation and demo catalog
        run: node --test tests/native-food-library-live-preview.test.cjs
      - name: Attach preview screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: food-library-preview-live-desktop-mobile
          path: |
            native-preview-dark.png
            native-preview-light.png
            native-preview-mobile.png
          if-no-files-found: ignore
