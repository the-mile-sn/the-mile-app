name: Validate admin visual portions library
on:
  pull_request:
    branches: [production/the-mile-admin]
jobs:
  visual-portions:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install photo validation support
        run: python -m pip install Pillow
      - name: Validate Python module and tests
        run: |
          python -m py_compile app.py visual_portions_v2.py visual_portion_matching_v2.py test_visual_portions_v2.py test_visual_portion_matching_v2.py
          python -m unittest -v test_visual_portions_v2.py test_visual_portion_matching_v2.py
      - name: Validate browser JavaScript
        run: node --check static/visual-portions.js
