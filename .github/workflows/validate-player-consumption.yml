name: Player peri-consumption regression

on:
  push:
    branches:
      - main
    paths:
      - 'consumption_*.py'
      - 'test_consumption_*.py'
      - 'static/jogador-v2.js'
      - 'static/jogador-v2.css'
      - 'static/player-consumption.css'
      - '.github/workflows/validate-player-consumption.yml'
  pull_request:
    paths:
      - 'consumption_*.py'
      - 'test_consumption_*.py'
      - 'app.py'
      - 'static/jogador-v2.js'
      - 'static/jogador-v2.css'
      - '.github/workflows/validate-player-consumption.yml'
  workflow_dispatch:

jobs:
  isolated-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compile production consumption modules
        run: python -m py_compile consumption_source_v2.py consumption_records_v2.py consumption_timing_v2.py consumption_nutrition_v2.py meal_option_selection_v2.py food_plan_player_v2.py app.py
      - name: Check player JavaScript syntax
        run: node --check static/jogador-v2.js
      - name: Test published peri phases, nutrition and isolated event records
        run: python -m unittest -v test_consumption_source_v2 test_consumption_persistence_v2 test_consumption_nutrition_v2 test_consumption_service_flow_v2 test_consumption_integration_gate test_consumption_timing_v2 test_consumption_timing_ui_contract
