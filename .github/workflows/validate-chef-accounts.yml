name: Validate Chef account foundation
on:
  push:
    branches: [feature/chef-accounts-foundation]
  pull_request:
    branches: [production/the-mile-admin]
jobs:
  chef-regressions:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest -v test_chef_accounts_v2 test_player_account_creation_v2 test_player_admin_lifecycle_v2
      - run: node --check static/chef.js
      - run: node --check static/app.js
      - run: node --check static/admin-chefs.js
  chef-postgres-migration:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: chef_test
          POSTGRES_PASSWORD: chef_test
          POSTGRES_DB: chef_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U chef_test -d chef_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CHEF_PG_TEST_DATABASE_URL: postgresql://chef_test:chef_test@127.0.0.1:5432/chef_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest -v test_chef_postgres_migration
