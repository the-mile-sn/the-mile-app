name: Diagnose recipe editor tests
on:
  pull_request:
    branches: [production/the-mile-admin]
jobs:
  capture:
    runs-on: ubuntu-latest
    outputs:
      failed: ${{ steps.capture.outputs.failed }}
    steps:
      - uses: actions/checkout@v4
      - id: capture
        shell: bash
        run: |
          node --test --test-reporter=tap tests/admin-recipe-library.test.cjs tests/admin-menus-recipes-navigation.test.cjs tests/admin-clinical-navigation.test.cjs > /tmp/recipe-out.txt 2>&1 || true
          echo "failed=$(grep -m1 '^not ok' /tmp/recipe-out.txt | cut -c 1-170)" >> "$GITHUB_OUTPUT"
  result:
    needs: [capture]
    if: always()
    runs-on: ubuntu-latest
    name: "Failed ${{ needs.capture.outputs.failed }}"
    steps:
      - run: echo Test diagnostic captured
