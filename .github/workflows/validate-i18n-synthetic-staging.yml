name: Validate isolated synthetic i18n staging
on:
  push:
    branches: [validation/i18n-pten-20261123]
  workflow_dispatch:
jobs:
  synthetic-readiness:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      MILE_DATA_DIR: /tmp/the-mile-i18n-pten-20261123
      MILE_SITE_ROLE: player
      MILE_I18N_SYNTHETIC_DATA: "1"
      MILE_APP_TRANSLATIONS_ENABLED: "1"
      MILE_PLAYER_LANGUAGE_SELECTION_ENABLED: "1"
      MILE_APP_TRANSLATION_DIAGNOSTIC: "0"
      MILE_I18N_VALIDATION_PASSWORD: "only-fake-github-ci-validation-password-1234"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: python -m py_compile app.py tools/seed_i18n_validation.py
      - run: python -m unittest discover -s tests -p test_i18n_private_diagnostic.py -v
      - name: Seed and verify synthetic bilingual app data
        run: |
          python tools/seed_i18n_validation.py
          python tools/seed_i18n_validation.py --verify
      - name: Validate JavaScript remains syntactically correct
        run: |
          node --check static/jogador-v2.js
          node --check static/chef.js
          node --check static/player-recipes.js
      - name: Verify production DB is never configured in staging
        run: |
          test -z "${DATABASE_URL:-}"
          test "$MILE_SITE_ROLE" = player
          test "$MILE_I18N_SYNTHETIC_DATA" = 1
      - name: Install headless Chromium for synthetic mobile/desktop checks
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Start isolated test server
        run: |
          gunicorn wsgi:application --bind 127.0.0.1:8941 > /tmp/the-mile-i18n-synthetic.log 2>&1 &
          for n in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8941/ > /dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8941/ > /dev/null
      - name: Validate PT/EN in real browser (synthetic data only)
        env:
          MILE_I18N_TEST_URL: http://127.0.0.1:8941
        run: python tools/validate_i18n_visual.py
      - name: Upload comparison screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: i18n-pten-synthetic-mobile-desktop
          path: artifacts/i18n-visual/
          retention-days: 7
          if-no-files-found: ignore
