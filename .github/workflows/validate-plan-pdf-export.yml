name: Validate plan PDF export
on:
  pull_request:
    paths:
      - 'plan_export_pdf_v2.py'
      - 'test_plan_export_pdf_v2.py'
      - 'app.py'
      - 'static/admin-microcycles.js'
      - 'requirements.txt'
      - '.github/workflows/validate-plan-pdf-export.yml'
  push:
    branches:
      - 'feature/plan-pdf-export-v1'
jobs:
  pdf-export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest -v test_plan_export_pdf_v2.py
      - run: python -m py_compile app.py plan_export_pdf_v2.py
      - run: node --check static/admin-microcycles.js
