name: Validate player private photo and request performance
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  image-and-request-regressions:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m compileall -q app.py test_player_access_profile_bridge.py
      - run: node --check static/jogador-v2.js
      - run: node --test tests/player-private-photo-performance.test.cjs tests/player-session-isolation.test.cjs tests/player-followup-profile.test.cjs tests/player-loading-experience.test.cjs
      - run: python -m unittest -v test_player_access_profile_bridge
