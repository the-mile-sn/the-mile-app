name: Translation foundation - isolated unit tests

on:
  push:
    branches:
      - "feature/app-translation-foundation-*"
    paths:
      - "content_translations_v2.py"
      - "test_content_translations_v2.py"
      - ".github/workflows/validate-app-translation-foundation.yml"
  pull_request:
    paths:
      - "content_translations_v2.py"
      - "test_content_translations_v2.py"
      - ".github/workflows/validate-app-translation-foundation.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile and test isolated translation module
        run: |
          python -m py_compile content_translations_v2.py test_content_translations_v2.py
          python -m unittest -v test_content_translations_v2.py
