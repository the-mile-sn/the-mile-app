name: Validate player profile subpages
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  profile-subpages:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - run: node --check static/jogador-v2.js
      - run: node --test tests/player-profile-subpages.test.cjs tests/player-header-assessments.test.cjs tests/player-session-isolation.test.cjs
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest -v test_player_access_profile_bridge
